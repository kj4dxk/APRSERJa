plugins {
    id 'com.android.application' version '8.13.2'
    id 'org.jetbrains.kotlin.android' version '2.2.21'
    id 'org.jetbrains.kotlin.jvm' version '2.2.21' apply false
}
def releaseVersion = file('version.txt').text.trim()
def releaseMinute = java.time.LocalDateTime.parse(releaseVersion, java.time.format.DateTimeFormatter.ofPattern('uuuu.MM.dd.HHmm'))
android {
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildFeatures { buildConfig true }
    namespace 'org.aprserja.mobile'
    compileSdk 36
    defaultConfig {
        applicationId 'org.aprserja.mobile'
        minSdk 26
        targetSdk 36
        versionCode Math.toIntExact(java.time.Duration.between(java.time.LocalDateTime.of(2020,1,1,0,0), releaseMinute).toMinutes())
        versionName releaseVersion
    }
    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = variant.buildType.name == 'release' ? 'APRSERJa-unsigned.apk' : 'APRSERJa-debug.apk'
        }
    }
}

kotlin { jvmToolchain(17) }

dependencies {
    implementation project(':core')
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
}

