<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'"><title>APRSISOSM</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f7f6ef;color:#173536;font:16px Roboto,Arial,sans-serif}header,main{padding:12px}header{background:#173536;color:white}h1{font-size:21px;margin:0}canvas{width:100%;height:44vh;display:block;background:#e9ede4;touch-action:none}small{display:block;padding:3px 12px}input,button,select{max-width:100%;font:inherit;padding:8px;margin:3px;border:1px solid #8aa09b;border-radius:5px}button{color:white;background:#235a52}summary{padding:10px 0;font-weight:bold}p{overflow-wrap:anywhere}</style>
<header><h1>APRSISOSM</h1><span id="status">Disconnected</span></header><canvas id="map"></canvas><small>© OpenStreetMap contributors · ODbL 1.0</small><main>
<button id="zin">Zoom in</button><button id="zout">Zoom out</button><button id="importer">Open .osm region</button>
<details open><summary>Address search &amp; walking route</summary><input id="query" placeholder="Street, number or place"><select id="places" aria-label="Search results"></select><button id="gps">Start GPS</button><label><input type="checkbox" id="follow" checked>Follow GPS</label><button id="drive">Drive here</button><button id="start">Set start</button><button id="route">Walk here</button><p id="directions"></p></details>
<details open><summary>Live stations &amp; messages</summary><select id="stations" aria-label="Stations"></select><button id="locate">Show station</button><input id="peer" placeholder="Recipient callsign"><input id="message" maxlength="67" placeholder="Message"><button id="send">Send</button><div id="history"></div></details>
<details><summary>APRS-IS connection</summary><input id="host" value="rotate.aprs2.net"><input id="port" type="number" value="14580"><input id="call" placeholder="Your callsign"><input id="pass" type="password" value="-1"><button id="connect">Connect near map center</button><button id="stop">Disconnect</button></details></main><script src="app.js"></script></html>
